name: Build MAUI iOS (Gratis)

# Esto permite que el script no corra solo, sino que vos apretes un botón para compilar
on:
  workflow_dispatch: 

jobs:
  build-ios:
    runs-on: macos-14 # Usamos un servidor de Apple gratuito

    steps:
    - name: Clonar el código
      uses: actions/checkout@v4

    - name: Configurar .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # IMPORTANTE: Cambialo a 9.0.x o 10.0.x según lo que uses

    - name: Instalar motor de MAUI
      run: dotnet workload install maui

    - name: Compilar y Generar .ipa (Sin firma)
      # IMPORTANTE: 
      # 1. Cambiá "VerticeMobile/VerticeMobile.csproj" por la ruta real de tu proyecto dentro del repositorio.
      # 2. Asegurate de que el "-f net8.0-ios" coincida con tu versión de .NET.
      run: dotnet publish VerticeMobile.csproj -f net10.0-ios -c Release -p:RuntimeIdentifier=ios-arm64 -p:EnableCodeSigning=false -p:BuildIpa=true

    - name: Subir el archivo descargable
      uses: actions/upload-artifact@v4
      with:
        name: VerticeApp-iOS
        path: '**/*.ipa'
