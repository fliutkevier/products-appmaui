name: Build MAUI iOS (Gratis)

on:
  workflow_dispatch: 

jobs:
  build-ios:
    # Usamos macos-14 que es el entorno nativo perfecto para .NET 8 y Xcode 15
    runs-on: macos-14 
    
    steps:
    - name: Clonar el código
      uses: actions/checkout@v4

    - name: Configurar .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' 

    - name: Instalar motor de MAUI
      run: dotnet workload install maui

    - name: Compilar y Generar .ipa (Sin firma)
      # Fijate que acá le mandamos la orden estricta de usar net8.0-ios
      run: dotnet publish VerticeMobile.csproj -f net8.0-ios -c Release -p:RuntimeIdentifier=ios-arm64 -p:EnableCodeSigning=false -p:BuildIpa=true

    - name: Subir el archivo descargable
      uses: actions/upload-artifact@v4
      with:
        name: VerticeApp-iOS
        path: '**/*.ipa'
